name: Check FARS game
on:
  push:
    branches: [main, feature/v0.3-illustrated-board]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests
        run: node --test tests/*.test.mjs
      - name: Verify board file exists
        run: test -s assets/fars-board.svg
